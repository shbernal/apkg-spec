name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  commit-check:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check commit messages against .github/cchk.toml
        uses: commit-check/commit-check-action@v2
        with:
          message: true
          branch: false

  verify:
    name: Verify spec
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test claims
        run: uv run pytest

      - name: Check conformance packages against the oracle
        run: uv run oracle/fixtures.py --check

      - name: Score implementations
        run: uv run eval/run.py --strict -v
