# Implementations under test. Each command runs from the repository root.
#
#   read   prints the canonical model (model.schema.json) of {input} on stdout
#   write  writes {model}, a canonical model file, to {output} as a package of
#          version {version}; {media} is a directory holding each media file
#          the model names, under that name, since the model holds only hashes
#   write_versions  the package versions to score `write` at; [2] by default
#
# Leave `write` out for a read-only implementation.

[anki-apkg-export]
read = "node adapters/anki-apkg-export/read.mjs {input}"
write = "node adapters/anki-apkg-export/write.mjs {model} {media} {output} --version {version}"
write_versions = [2, 3]
build = "sh -c 'if [ -n \"$ANKI_APKG_EXPORT\" ]; then pnpm -C \"$ANKI_APKG_EXPORT\" run build; else npm ci --prefix adapters/anki-apkg-export --no-audit --no-fund; fi'"
